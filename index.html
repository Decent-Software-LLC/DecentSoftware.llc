<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Decent Software LLC builds thoughtful software for a more decent web."
    />
    <meta name="theme-color" content="#f4f7fb" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Decent Software LLC</title>
    <style>
      :root {
        color-scheme: light;
        --primary-color: #3b86f6;
        --text-color: #231f20;
        --background-color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        background: var(--background-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      main {
        display: grid;
        flex: 1;
        place-items: center;
        padding: clamp(2rem, 6vw, 5rem) 1.25rem;
        text-align: center;
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2rem);
        width: 100%;
      }

      .wordmark {
        --logo-height: clamp(3.5rem, 7vw, 4rem);
        display: flex;
        align-items: baseline;
        justify-content: center;
        width: 100%;
        max-width: 700px;
        margin: 0;
        line-height: 1;
      }

      .wordmark__logo {
        display: block;
        width: auto;
        height: var(--logo-height);
      }

      .wordmark__extension {
        color: var(--primary-color);
        font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
        font-size: calc(var(--logo-height) * 0.785);
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 1;
        margin-left: 0.08em;
        transform: translateY(calc(var(--logo-height) * -0.2));
        white-space: nowrap;
      }

      .wordmark__spaced-letter {
        margin-right: 0.07em;
      }

      .tagline {
        max-width: 38rem;
        margin: 0;
        color: #4c4849;
        font-size: clamp(1rem, 2vw, 1.3rem);
        line-height: 1.6;
      }

      .world-scene {
        position: relative;
        isolation: isolate;
        width: clamp(10rem, 22vw, 17rem);
        aspect-ratio: 1;
      }

      .clay-world {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 1rem 1.25rem rgb(35 31 32 / 0.14));
      }

      .clay-moon {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: 28%;
        height: auto;
        animation: moon-orbit 10s ease-in-out infinite;
        filter: drop-shadow(0 0.35rem 0.45rem rgb(35 31 32 / 0.18));
      }

      @keyframes moon-orbit {
        0% {
          z-index: 1;
          left: calc(-50px - 28%);
          width: 28%;
          transform: translateY(-50%);
        }

        25% {
          width: calc(28% - 30px);
        }

        49.999% {
          z-index: 1;
          left: calc(100% + 50px);
          width: 28%;
          transform: translateY(-50%);
        }

        50% {
          z-index: 3;
          left: calc(100% + 50px);
          width: 28%;
          transform: translateY(-50%);
        }

        75% {
          width: calc(28% + 30px);
        }

        100% {
          z-index: 3;
          left: calc(-50px - 28%);
          width: 28%;
          transform: translateY(-50%);
        }
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .site-footer {
        margin-top: auto;
        padding: 2rem 0;
        background: var(--text-color);
        color: #ffffff;
      }

      .footer-content {
        text-align: center;
      }

      .footer-text {
        margin: 0 0 1.25rem;
      }

      .footer-decent {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 1.25rem;
      }

      .footer-brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .footer-logo-image {
        display: block;
        width: auto;
        height: 28px;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      .footer-links a {
        color: #8fbcff;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.3s, opacity 0.3s;
      }

      .footer-links a:hover,
      .footer-links a:focus-visible {
        color: #c9ddff;
      }

      .footer-copyright {
        margin: 0;
        opacity: 0.82;
      }

      @media (max-width: 600px) {
        .wordmark {
          --logo-height: 11vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .clay-moon {
          z-index: 3;
          animation: none;
          left: calc(-50px - 28%);
          transform: translateY(-50%);
        }
      }

    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="site-title">
        <h1 class="wordmark" id="site-title">
          <img
            class="wordmark__logo"
            src="assets/images/decent.png"
            alt="Decent"
            width="4836"
            height="1926"
          /><span class="wordmark__extension"
            >so<span class="wordmark__spaced-letter">f</span
            ><span class="wordmark__spaced-letter">t</span>ware.llc</span
          >
        </h1>
        <p class="tagline">Thoughtful software for a more decent web.</p>
        <div class="world-scene">
          <img
            class="clay-world"
            src="assets/images/clay-world.png"
            alt="A claymation planet Earth"
            width="1254"
            height="1254"
          />
          <img
            class="clay-moon"
            src="assets/images/clay-moon.png"
            alt=""
            width="1254"
            height="1254"
          />
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-content">
          <p class="footer-text">Building a more decent web, one project at a time.</p>
          <div class="footer-decent">
            <div class="footer-brand">
              <img
                src="assets/images/decent.png"
                alt="Decent"
                class="footer-logo-image"
              />
            </div>
            <nav class="footer-links" aria-label="Other Decent sites">
              <a href="https://decent.apartments/" target="_blank" rel="noopener">Apartments</a>
              <a href="https://decent.charity/" target="_blank" rel="noopener">Charity</a>
              <a href="https://decent.church/" target="_blank" rel="noopener">Church</a>
              <a href="https://decent.clothing/" target="_blank" rel="noopener">Clothing</a>
              <a href="https://decent.food/" target="_blank" rel="noopener">Food</a>
            </nav>
          </div>
          <p class="footer-copyright">© 2026 Decent Software LLC. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
